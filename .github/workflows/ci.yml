name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # pnpm must exist before setup-node: setup-node@v5 detects the
      # packageManager field (pnpm) and the cache: pnpm store path needs it.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: "Lint (includes @core/* purity: no-restricted-imports)"
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Core purity guard: @core/domain and @core/types must compile cleanly with no DOM and no node types.
      # Any platform dependency that sneaks into the kernel turns this red — the safeguard that keeps "one shared core across all four clients" from being an empty slogan.
      - name: Core purity guard
        run: pnpm core:purity
