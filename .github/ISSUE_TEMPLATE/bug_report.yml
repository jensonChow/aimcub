name: Bug Report
description: Report a problem with Aimcub Desktop, CLI, or the MCP worker.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Aimcub is pre-release local
        alpha software, so please include enough detail to reproduce the issue.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro-steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps, as minimal as you can make them.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Surface
      description: Which part of Aimcub does this affect?
      options:
        - Desktop
        - CLI
        - MCP
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Output of `git rev-parse HEAD`, a package version, or the commit you built from.
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: e.g. macOS 15.1 (Sequoia)
    validations:
      required: false

  - type: dropdown
    id: aimcub-home
    attributes:
      label: Did you use an isolated AIMCUB_HOME?
      description: See CONTRIBUTING.md — isolating local data helps rule out store-corruption causes.
      options:
        - "Yes, isolated AIMCUB_HOME"
        - "No, default ~/.aimcub"
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: gate-status
    attributes:
      label: Gate status
      description: Does `pnpm build && pnpm test && pnpm typecheck && pnpm lint && pnpm core:purity` pass on your checkout?
      options:
        - Green (all pass)
        - Red (one or more fail — please paste output above)
        - Not run / not applicable
    validations:
      required: true
